name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint & Test
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Harden GitHub Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1 / Node 24
        with:
          disable-telemetry: true
          disable-sudo-and-containers: true
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 / Node 24
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0 / Node 24
        with:
          python-version: "3.12"
          check-latest: true
          cache: "pip"
          cache-dependency-path: |
            pyproject.toml
            requirements-dev.txt

      - name: Show Python and pip versions
        run: |
          python --version
          python -m pip --version

      - name: Install dev dependencies (editable)
        run: |
          set -eux
          python -m pip install --upgrade pip
          # preferisci extras da pyproject, fallback a requirements-dev
          if python -m pip install -e ".[dev]"; then
            echo "Installed from pyproject extras."
          elif [ -f requirements-dev.txt ]; then
            python -m pip install -r requirements-dev.txt
          else
            echo "No dev requirements found." >&2
            exit 1
          fi

      - name: Lint & static checks (pre-commit)
        run: |
          set -eux
          pre-commit run --all-files --show-diff-on-failure

      - name: Run tests
        env:
          PYTHONWARNINGS: default
        run: |
          set -eux
          pytest -vv
