name: Supply chain security

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches:
      - main
      - master
  schedule:
    - cron: '0 3 * * 1'  # lunedì alle 03:00 UTC
  workflow_dispatch:

permissions: {}  # default: nessun permesso, li diamo per job

jobs:
  dependency-review:
    name: Dependency review (GitHub Advisory)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04

    permissions:
      contents: read
      pull-requests: read

    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1 / Node 24
        with:
          disable-telemetry: true
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 / Node 24

      - name: Dependency review
        uses: actions/dependency-review-action@3c4e3dcb1aa7874d2c16be7d79418e9b7efd6261 # v4.8.2
        with:
          fail-on-severity: moderate
          # es: deny-licenses, allow-licenses, ecc. se vorrai stringere ancora

  pip-audit:
    name: pip-audit (Python dependencies)
    runs-on: ubuntu-24.04

    # opzionale: non girare sui PR draft
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false

    permissions:
      contents: read

    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1 / Node 24
        with:
          disable-telemetry: true
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 / Node 24

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0 / Node 24
        with:
          python-version: '3.12'
          cache: pip

      - name: pip-audit (requirements-dev)
        uses: pypa/gh-action-pip-audit@v1.1.0
        with:
          # nel repo hai requirements-dev.txt, quindi:
          inputs: requirements-dev.txt
          # volendo: require-hashes: true, vulnerability-service: osv, ecc.

  scorecard:
    name: OpenSSF Scorecard
    # lo facciamo girare solo su main, tipico per Scorecard
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04

    permissions:
      contents: read
      security-events: write
      id-token: write

    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1 / Node 24
        with:
          disable-telemetry: true
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 / Node 24
        with:
          persist-credentials: false

      - name: Run Scorecard analysis
        uses: ossf/scorecard-action@4eaacf0543bb3f2c246792bd56e8cdeffafb205a # v2.4.3
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
